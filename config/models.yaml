# Model capability registry — only models AVF actually loads. A model belongs
# here when pipeline code imports or downloads it; anything else (the old
# ComfyUI image generation, MLX video generation) is not part of the product
# and is not listed.
#
# status:   primary | fallback — which tier the task uses
# required: true | false       — false models are optional: they install on
#                                demand, and the UI explains what they are for
models:
  # ── TTS ──────────────────────────────────────────────
  - name: kokoro-82m
    task: tts
    backend: kokoro
    ram_requirement_gb: 0.8
    disk_requirement_gb: 0.3
    apple_silicon: true
    commercial_license: true
    install_method: "pip install kokoro-onnx"
    status: primary
    required: true
    description: >-
      Narration (voice-over) for every video — 45 voices across English,
      Spanish, French, Italian, Portuguese and Hindi. Weights (~310 MB)
      download on first run.

  - name: piper-voices
    task: tts
    backend: piper
    ram_requirement_gb: 0.5
    disk_requirement_gb: 0.3
    apple_silicon: true
    commercial_license: true
    install_method: "automatic — fetched per voice on first use"
    status: primary
    required: false
    description: >-
      Native-accent voices for the languages Kokoro cannot speak — Indonesian,
      German, French male. Fetched automatically (~20-60 MB each) the first
      time you pick one of them in Settings → Voice.

  # ── STT ──────────────────────────────────────────────
  - name: whisper-small
    task: stt
    backend: whisper
    ram_requirement_gb: 1.5
    disk_requirement_gb: 0.5
    apple_silicon: true
    commercial_license: true
    install_method: "pip install faster-whisper"
    status: fallback
    required: false
    description: >-
      Fallback subtitles: transcribes the narration audio when the
      script-locked subtitles cannot be built. Weights (~460 MB) download on
      first use.
