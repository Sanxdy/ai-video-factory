[project]
name = "ai-video-factory"
version = "1.0.0"
description = "Local AI content production factory (idea → YouTube Short)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "httpx>=0.27",
    "requests>=2.31",
    "tenacity>=8.0",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "kokoro-onnx>=0.1",
    "piper-tts>=1.3",
    # pinned: 2.x is compiled with no cp311 wheels for the bundled python
    "lingua-language-detector==1.3.5",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
# The desktop shell only. A server install (VPS) has no display and must not
# pull pyobjc/pythonnet into its environment.
desktop = ["pywebview>=5"]

[project.scripts]
avf = "apps.cli:main_entry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "core*", "providers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]